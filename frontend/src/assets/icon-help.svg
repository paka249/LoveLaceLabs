<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- Circle -->
  <circle cx="400" cy="400" r="300" fill="none" stroke="#5af0b3" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Question mark -->
  <g>
    <!-- Curved top of ? -->
    <path d="M 300 280 Q 300 200 400 200 Q 480 200 480 280 Q 480 340 400 360" fill="none" stroke="#5af0b3" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Dot -->
    <circle cx="400" cy="500" r="35" fill="#5af0b3"/>
  </g>
</svg>
